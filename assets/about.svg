<text x="640" y="168" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="3" fill="#C8FF2E" fill-opacity="0.95" text-anchor="start">NOW</text>
<text x="716" y="168" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#EFE9D8" fill-opacity=".85">CSE (AI/ML) at Chandigarh University.</text>
