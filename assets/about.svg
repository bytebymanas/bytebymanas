<circle cx="1100" cy="30" r="110" fill="#EFE9D8" fill-opacity="0.12" filter="url(#bl)"></circle>
<rect x="16" y="16" width="1168" height="268" rx="20" fill="url(#gf)"/><rect x="16.5" y="16.5" width="1167" height="267" rx="20" fill="none" stroke="url(#gs)"/><rect x="36" y="17" width="1128" height="1" fill="url(#hl)"/>
<text x="56" y="62" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="4" fill="#C8FF2E" fill-opacity="0.95" text-anchor="start">ABOUT</text>
<text x="54" y="136" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="46" fill="#EFE9D8">I turn messy data</text>
