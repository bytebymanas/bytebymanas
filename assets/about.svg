<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="I turn messy data into useful decisions. Currently CSE (AI/ML) at Chandigarh University. Previously ML Intern at FlyRank.">
<defs>
