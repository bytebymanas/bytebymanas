<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Turning data into decisions.">
<defs>
<linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE9D8" stop-opacity=".12"/><stop offset="1" stop-color="#EFE9D8" stop-opacity=".03"/></linearGradient>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFE9D8" stop-opacity=".55"/><stop offset=".45" stop-color="#EFE9D8" stop-opacity=".08"/><stop offset="1" stop-color="#C8FF2E" stop-opacity=".4"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#EFE9D8" stop-opacity="0"/><stop offset=".5" stop-color="#EFE9D8" stop-opacity=".65"/><stop offset="1" stop-color="#EFE9D8" stop-opacity="0"/></linearGradient>
<filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="46"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#EFE9D8" fill-opacity=".09"/></pattern>
<clipPath id="c"><rect width="1200" height="120" rx="22"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="1200" height="120" fill="#07080A"/><rect width="1200" height="120" fill="url(#dots)"/>
<circle cx="600" cy="130" r="180" fill="#C8FF2E" fill-opacity="0.32" filter="url(#bl)"><animateTransform attributeName="transform" type="translate" values="0 0;60 0;0 0" dur="10s" repeatCount="indefinite"/></circle>
<rect x="8" y="8" width="1184" height="104" rx="18" fill="url(#gf)"/><rect x="8.5" y="8.5" width="1183" height="103" rx="18" fill="none" stroke="url(#gs)"/><rect x="26" y="9" width="1148" height="1" fill="url(#hl)"/>
<text x="600.0" y="68" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="9" fill="#EFE9D8" fill-opacity="0.9" text-anchor="middle">TURNING DATA INTO DECISIONS</text>
<rect x="850.0" y="54" width="10" height="18" fill="#C8FF2E"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/></rect>
<text x="40" y="68" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="3" fill="#EFE9D8" fill-opacity="0.45" text-anchor="start">@BYTEBYMANAS</text>
<text x="1160" y="68" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="3" fill="#EFE9D8" fill-opacity="0.45" text-anchor="end">ML ENGINEER</text>
</g>
<rect x=".5" y=".5" width="1199" height="119" rx="22" fill="none" stroke="#EFE9D8" stroke-opacity=".16"/>
</svg>