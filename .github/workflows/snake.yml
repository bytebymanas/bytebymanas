name: Generate blue contribution snake

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate dynamic blue snake
        uses: Platane/snk@v3
        with:
          github_user_name: bytebymanas
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/blue-contribution-snake.svg?palette=github-dark&color_snake=#60A5FA&color_dots=#0F172A,#172554,#1D4ED8,#3B82F6,#60A5FA

      - name: Publish blue snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
