name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: bytebymanas
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=F97316&color_dots=1C1917,FED7AA,FBBF24,EA580C,F97316
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=FBBF24&color_dots=1C1917,7C2D12,EA580C,F97316,FBBF24
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
