name: Generate lime contribution snake

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate dynamic lime snake
        uses: Platane/snk@v3
        with:
          github_user_name: bytebymanas
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/lime-contribution-snake.svg?palette=github-dark&color_snake=#EFE9D8&color_dots=#14161A,#2B3A0E,#5A7A12,#99CC1A,#C8FF2E

      - name: Publish lime snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
